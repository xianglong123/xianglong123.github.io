<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分镜工坊：AI 出原画，你拼漫画 | 123的个人主页</title>
<meta name="description" content="单文件网页的分镜排版工具：拖图进格、双击改台词、五种气泡、多页、导出 2x PNG；并按格生成原画提示词，角色设定与画风常驻。">
<style>
/* ========== 基础 ========== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:#12141a;color:#e8e9ee;
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:13px;overflow:hidden;
}
:root{
  --ink:#14161a; --paper:#f6f4ef; --line:2.4px;
  --ui:#191c23; --ui2:#20242c; --ui3:#2b3040;
  --acc:#e2603a; --txt:#e8e9ee; --dim:#8b91a1;
}

/* ========== 顶栏 ========== */
.top{
  height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(#1d2029,#171a21);border-bottom:1px solid #2b2f3b;position:relative;z-index:9;
}
.topback{color:#9aa1b2;text-decoration:none;font-size:12px;padding:6px 10px;border:1px solid #333849;border-radius:8px;margin-right:4px}
.topback:hover{color:#fff;border-color:#4c5470}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}
.logo{width:24px;height:24px;border-radius:5px;background:linear-gradient(135deg,#e2603a,#a83b2a);
  display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.brand b{font-size:14px;letter-spacing:.5px}
.brand span{color:var(--dim);font-size:11px}
.btn{
  height:32px;padding:0 12px;border-radius:8px;border:1px solid #333849;background:#222632;color:#dfe2ea;
  cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:.15s;font-family:inherit;
}
.btn:hover{background:#2c3140;border-color:#454b60}
.btn:active{transform:translateY(1px)}
.btn.acc{background:var(--acc);border-color:#c94e2c;color:#fff;font-weight:600}
.btn.acc:hover{background:#f06a42}
.btn.ghost{background:transparent;border-color:#333849}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.spacer{flex:1}
.seg{display:flex;background:#1b1e27;border:1px solid #2f3442;border-radius:8px;overflow:hidden}
.seg button{height:30px;padding:0 10px;background:transparent;border:0;color:#b9bfcd;font-size:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:#313849;color:#fff}
.seg button:hover{color:#fff}

/* ========== 主区 ========== */
.wrap{display:flex;height:calc(100% - 52px)}
.stage{
  flex:1;overflow:auto;background:
    radial-gradient(circle at 30% 12%,#232734 0,#15171e 55%,#101218 100%);
  display:grid;place-items:center;padding:30px;position:relative;
}
.page-wrap{position:relative;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
.page{position:relative;transform-origin:top left;background:#f6f4ef}

/* ---------- 画格 ---------- */
.panel{position:absolute;overflow:hidden;background:#fff;border:var(--line) solid var(--ink);isolation:isolate}
.panel .pimg{
  position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;
  transform-origin:center center;user-select:none;-webkit-user-drag:none;pointer-events:none;
}
.panel .pimg.gray{filter:grayscale(1) contrast(1.08)}
.panel .ph{
  position:absolute;inset:0;display:grid;place-items:center;color:#9aa0ad;font-size:13px;
  background:repeating-linear-gradient(45deg,#f4f2ec 0 10px,#efece4 10px 20px);text-align:center;padding:10px;
}
.panel .pimg.gray ~ .ph{display:none}
.pbadge{
  position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:5px;background:rgba(20,22,26,.72);
  color:#fff;font-size:10px;letter-spacing:.5px;pointer-events:none;opacity:.9
}
.page .panel.sel{outline:2px dashed rgba(226,96,58,.9);outline-offset:2px}

/* ---------- 气泡 ---------- */
.bubble{position:absolute;cursor:move;user-select:none}
.bubble .txt{
  position:relative;z-index:2;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  line-height:1.5;white-space:pre-wrap;word-break:break-word;
}
.bubble .txt[contenteditable="true"]{user-select:text;cursor:text;outline:none}
.bubble.sel{outline:2px dashed rgba(226,96,58,.9);outline-offset:3px}

.sp{background:var(--paper);border:2.2px solid var(--ink);border-radius:44px/34px;padding:15px 20px;color:var(--ink)}
.sp .tail{position:absolute;width:46px;height:26px;pointer-events:none}
.sp .tail path{fill:var(--paper);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}

.sh{background:var(--paper);color:var(--ink);padding:22px 26px;border:2.6px solid var(--ink);
  clip-path:polygon(50% 0%,58% 12%,72% 4%,74% 18%,88% 12%,86% 26%,100% 26%,92% 38%,100% 50%,86% 56%,94% 70%,78% 68%,80% 84%,66% 78%,62% 94%,50% 84%,42% 98%,36% 82%,22% 90%,24% 72%,8% 78%,14% 62%,0% 56%,10% 46%,0% 34%,14% 30%,8% 16%,24% 20%,22% 6%,36% 14%,42% 0%)}

.th{background:var(--paper);border:2.2px solid var(--ink);border-radius:50%/46%;padding:22px 26px;color:var(--ink)}
.th::before,.th::after{content:"";position:absolute;border:2.2px solid var(--ink);background:var(--paper);border-radius:50%}
.th::before{width:18px;height:18px;left:22px;bottom:-20px}
.th::after{width:11px;height:11px;left:10px;bottom:-34px}

.bx{background:var(--paper);border:2.2px solid var(--ink);padding:12px 16px;color:var(--ink);border-radius:2px;text-align:left}

.sf{color:var(--ink);-webkit-text-stroke:6px var(--paper);paint-order:stroke fill;font-weight:800;letter-spacing:2px;
  text-align:center;padding:4px 10px;font-family:"PingFang SC","Noto Sans SC",sans-serif}

/* ---------- 选中手柄 ---------- */
.grip{position:absolute;z-index:8;background:var(--acc);border-radius:50%;width:11px;height:11px;cursor:pointer}
.handle{position:absolute;z-index:8;width:12px;height:12px;border-radius:3px;background:var(--acc);cursor:nwse-resize}

/* ========== 侧栏 ========== */
.side{width:302px;background:var(--ui);border-left:1px solid #2b2f3b;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid #2b2f3b}
.tabs button{flex:1;height:40px;background:transparent;border:0;color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--acc);background:#1d212a}
.pane{flex:1;overflow-y:auto;padding:14px}
.pane::-webkit-scrollbar{width:8px}
.pane::-webkit-scrollbar-thumb{background:#333849;border-radius:4px}

.field{margin-bottom:12px}
.field label{display:block;color:#a8aebd;font-size:11.5px;margin-bottom:5px;letter-spacing:.3px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;background:#20242d;border:1px solid #333849;border-radius:7px;color:#e4e7ef;
  padding:6px 8px;font-size:12.5px;font-family:inherit;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#5b6480}
.field textarea{resize:vertical;line-height:1.55}
.field .row{display:flex;gap:8px}
.field .row>*{flex:1}
.chk{display:flex;align-items:center;gap:7px;color:#cbd0dc;font-size:12px;cursor:pointer;margin-bottom:8px}
.chk input{accent-color:var(--acc)}
.hint{color:#6f7688;font-size:11px;line-height:1.6;margin-top:-4px}
.sub{color:#8b91a1;font-size:11px;margin:14px 0 8px;letter-spacing:1px;text-transform:uppercase}
.card{background:#1d212a;border:1px solid #2b3040;border-radius:9px;padding:10px;margin-bottom:10px}
.pill{display:inline-block;padding:2px 7px;border-radius:5px;background:#2a3040;color:#aeb5c6;font-size:10.5px;margin-left:6px}

/* 提示词 */
.pitem{background:#1d212a;border:1px solid #2b3040;border-radius:9px;padding:10px;margin-bottom:9px}
.pitem .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pitem .h b{font-size:12px;color:#ffb59c}
.pitem input,.pitem select,.pitem textarea{width:100%;background:#161a22;border:1px solid #2c3140;border-radius:6px;color:#dfe3ec;padding:5px 7px;font-size:12px;font-family:inherit;margin-bottom:6px;outline:none}
.pitem textarea{resize:vertical}
.pitem input::placeholder{color:#5c6274}

#out{width:100%;height:150px;background:#161a22;border:1px solid #2c3140;border-radius:8px;color:#cfd5e2;
  font-size:11.5px;line-height:1.6;padding:9px;font-family:"SF Mono",Menlo,monospace;resize:vertical;outline:none}

/* 空状态 */
.empty{color:#6f7688;font-size:12px;line-height:1.8;padding:8px 4px}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#262b36;border:1px solid #3a4152;color:#e9ecf3;padding:9px 16px;border-radius:9px;font-size:12.5px;
  transition:.22s;pointer-events:none;z-index:30;box-shadow:0 8px 26px rgba(0,0,0,.4)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#file{display:none}
</style>
</head>
<body>

<header class="top">
  <a class="topback" href="/" title="返回首页">← 首页</a>
  <div class="brand">
    <div class="logo">分</div>
    <div><b>分镜工坊</b> <span>我出原画，你拼页</span></div>
  </div>

  <div class="seg" id="layoutSeg">
    <button data-l="2x2" class="on">2×2</button>
    <button data-l="2x3">2×3</button>
    <button data-l="3x3">3×3</button>
    <button data-l="1p3">1大3小</button>
    <button data-l="strip">条漫</button>
  </div>

  <div class="seg" id="sizeSeg">
    <button data-s="v" class="on">竖版</button>
    <button data-s="s">方版</button>
    <button data-s="h">横版</button>
  </div>

  <button class="btn ghost" id="btnDemo">示例页</button>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnSave">存工程</button>
  <button class="btn ghost" id="btnOpen">打开</button>
  <button class="btn acc" id="btnExport">导出 PNG</button>
</header>

<main class="wrap">
  <div class="stage" id="stage">
    <div class="page-wrap" id="pageWrap">
      <div class="page" id="page"></div>
    </div>
  </div>

  <aside class="side">
    <div class="tabs">
      <button data-t="page" class="on">页面</button>
      <button data-t="sel">选中</button>
      <button data-t="prompt">原画提示词</button>
    </div>

    <!-- ===== 页面设置 ===== -->
    <div class="pane" id="pane-page">
      <div class="sub" style="margin-top:0">页</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <button class="btn sm" id="pgPrev">‹</button>
        <div id="pgLabel" style="flex:1;text-align:center;color:#cfd4e0;font-size:12.5px">1 / 1</div>
        <button class="btn sm" id="pgNext">›</button>
        <button class="btn sm ghost" id="pgAdd" title="新增一页">＋</button>
        <button class="btn sm ghost" id="pgCopy" title="复制当前页">⧉</button>
      </div>
      <div class="field">
        <label>纸色</label>
        <div class="row">
          <select id="paperColor">
            <option value="#f6f4ef">米白（推荐）</option>
            <option value="#ffffff">纯白</option>
            <option value="#f2efe6">宣纸</option>
            <option value="#1b1c20">黑底（夜戏）</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>页边距 <span id="vMargin">36</span> px</label>
        <input type="range" id="margin" min="0" max="120" value="36" style="width:100%">
      </div>
      <div class="field">
        <label>格间距 <span id="vGutter">14</span> px</label>
        <input type="range" id="gutter" min="0" max="60" value="14" style="width:100%">
      </div>
      <div class="field">
        <label>框线 <span id="vLine">2.4</span> px</label>
        <input type="range" id="linew" min="0" max="10" step="0.2" value="2.4" style="width:100%">
      </div>
      <div class="sub">加内容</div>
      <div class="field row" style="display:flex;gap:8px">
        <button class="btn sm" id="addSpeech">对话气泡</button>
        <button class="btn sm" id="addShout">喊叫</button>
      </div>
      <div class="field row" style="display:flex;gap:8px">
        <button class="btn sm" id="addThought">思考</button>
        <button class="btn sm" id="addBox">旁白框</button>
      </div>
      <div class="field row" style="display:flex;gap:8px">
        <button class="btn sm" id="addSfx">拟声字</button>
        <button class="btn sm" id="addPanel">加一格</button>
      </div>
      <div class="hint">选中画格：双击或拖图进去放原画；拖动画面可平移，滚轮缩放。选中气泡：双击改字，右中手柄改宽。</div>
      <div class="sub">清空</div>
      <div class="field row" style="display:flex;gap:8px">
        <button class="btn sm" id="clearImg">清图片</button>
        <button class="btn sm" id="clearBub">清气泡</button>
      </div>
    </div>

    <!-- ===== 选中属性 ===== -->
    <div class="pane" id="pane-sel" style="display:none">
      <div id="selBody"><div class="empty">点选画格或气泡，这里出它的属性。</div></div>
    </div>

    <!-- ===== 提示词 ===== -->
    <div class="pane" id="pane-prompt" style="display:none">
      <div class="field">
        <label>角色设定（每次都带上，锁住形象）</label>
        <textarea id="charDef" rows="7"></textarea>
      </div>
      <div class="field">
        <label>画风约定</label>
        <textarea id="styleDef" rows="3"></textarea>
      </div>
      <div class="sub">逐格描述</div>
      <div id="promptList"></div>
      <div class="sub">拼好的提示词</div>
      <textarea id="out" readonly></textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn sm" id="btnCopyAll">复制全部</button>
        <button class="btn sm ghost" id="btnCopyP1">只复制第一格</button>
      </div>
      <div class="hint" style="margin-top:10px">复制给我，我按格生成原画；你拿到图直接拖进对应格子。</div>
    </div>
  </aside>
  <input type="file" id="file" accept="image/*">
</main>

<div class="toast" id="toast"></div>

<script>
/* ================= 状态 ================= */
const DEF_CHAR = "女主「岚」，24 岁，东亚面孔。短马尾侧分碎发，前额一条深色布带，右眉上方一道细旧疤，眼型细长、眼神冷静但温和，左耳小金属耳钉，颈侧一道缎蓝色植入体接缝发微光。身形高挑匀称、肩背挺拔。深灰色战术外套（袖口卷起），深灰工装长裤，黑靴，肩上一条厚重扣带，腰侧小工具包，左腕黄铜机械表。";
const DEF_STYLE = "黑白漫画：日式干净线稿 + 网点纸，赛璐璐明暗两档，不要写实、不要三维渲染、不要彩色。画格内不要任何文字、不要对话框、不要分格线。";

const PAGE_SIZES = {
  v:{w:1080,h:1536, name:"竖版 2:3"},
  s:{w:1200,h:1200, name:"方版 1:1"},
  h:{w:1536,h:1080, name:"横版 3:2"}
};

const LAYOUTS = {
  "2x2": {cols:2,rows:2},
  "2x3": {cols:2,rows:3},
  "3x3": {cols:3,rows:3},
  "1p3": "bigTop",
  "strip": {cols:1,rows:4}
};

let S = {
  page:{w:1080,h:1536, margin:36, gutter:14, line:2.4, bg:"#f6f4ef"},
  layout:"2x2",
  panels:[],
  bubbles:[],
  pages:[],
  cur:0,
  sel:null,
  char: DEF_CHAR,
  style: DEF_STYLE,
  promptByPanel:{},
  scale:1,
  seq:1
};

const uid = () => "id" + (S.seq++);
const $ = s => document.querySelector(s);
const pageEl = $("#page");
const wrapEl = $("#pageWrap");
const stageEl = $("#stage");

/* ================= 版面生成 ================= */
function area(){
  const p = S.page;
  return {x:p.margin, y:p.margin, w:p.w-p.margin*2, h:p.h-p.margin*2};
}
function rectsForLayout(name){
  const a = area(), g = S.page.gutter, out = [];
  const L = LAYOUTS[name];
  if(L === "bigTop"){
    const h1 = Math.round((a.h - g) * 0.46);
    out.push({x:a.x,y:a.y,w:a.w,h:h1});
    const w3 = Math.round((a.w - g*2)/3);
    for(let i=0;i<3;i++){
      out.push({x:a.x + i*(w3+g), y:a.y+h1+g, w: (i===2? a.x+a.w-(a.x+i*(w3+g)) : w3), h:a.h-h1-g});
    }
    return out;
  }
  const cw = Math.round((a.w - g*(L.cols-1))/L.cols);
  const ch = Math.round((a.h - g*(L.rows-1))/L.rows);
  for(let r=0;r<L.rows;r++){
    for(let c=0;c<L.cols;c++){
      const x = a.x + c*(cw+g), y = a.y + r*(ch+g);
      out.push({
        x, y,
        w: (c===L.cols-1 ? a.x+a.w-x : cw),
        h: (r===L.rows-1 ? a.y+a.h-y : ch)
      });
    }
  }
  return out;
}
function applyLayout(name){
  S.layout = name;
  const rects = rectsForLayout(name);
  const oldImgs = S.panels.map(p=>({img:p.img, ox:p.ox, oy:p.oy, zoom:p.zoom, gray:p.gray}));
  S.panels = rects.map((r,i)=>{
    const o = oldImgs[i] || {};
    return {id:uid(), x:r.x, y:r.y, w:r.w, h:r.h, img:o.img||null, ox:o.ox||0, oy:o.oy||0, zoom:o.zoom||1, gray:o.gray||false};
  });
  // 气泡若属于已消失的画格则落回第一格
  if(S.panels.length){
    const p0 = S.panels[0];
    S.bubbles.forEach(b=>{ if(!S.panels.find(p=>p.id===b.panelId)) b.panelId = p0.id; });
  }
  S.sel = null;
  render();
}

/* ================= 多页 ================= */
function commitPage(){
  if(S.pages[S.cur]) S.pages[S.cur] = {panels:S.panels, bubbles:S.bubbles, layout:S.layout};
}
function updatePageBar(){
  $("#pgLabel").textContent = (S.cur+1) + " / " + S.pages.length;
  $("#pgPrev").disabled = S.cur === 0;
  $("#pgNext").disabled = S.cur >= S.pages.length - 1;
  $("#pgPrev").style.opacity = S.cur === 0 ? .45 : 1;
  $("#pgNext").style.opacity = S.cur >= S.pages.length - 1 ? .45 : 1;
}
function loadPage(i){
  if(i < 0 || i >= S.pages.length) return;
  commitPage();
  S.cur = i;
  const pg = S.pages[i];
  S.panels = pg.panels || [];
  S.bubbles = pg.bubbles || [];
  S.layout = pg.layout || S.layout;
  S.sel = null;
  render();
  updatePageBar();
}
function newPage(){
  commitPage();
  S.pages.push({panels:[], bubbles:[], layout:S.layout});
  S.cur = S.pages.length - 1;
  S.panels = []; S.bubbles = []; S.sel = null;
  applyLayout(S.layout);
  commitPage();
  updatePageBar();
  toast("新增第 " + S.pages.length + " 页");
}
function copyPage(){
  commitPage();
  const pg = S.pages[S.cur];
  const clone = JSON.parse(JSON.stringify({panels:pg.panels, bubbles:pg.bubbles, layout:pg.layout}));
  clone.panels.forEach(p=>p.id = uid());
  const idmap = {};
  clone.panels.forEach((p,i)=> idmap[(pg.panels[i]||{}).id] = p.id);
  clone.bubbles.forEach(b=>{ b.id = uid(); if(idmap[b.panelId]) b.panelId = idmap[b.panelId]; });
  S.pages.splice(S.cur+1, 0, clone);
  loadPage(S.cur+1);
  toast("已复制为新页");
}
$("#pgPrev").onclick = ()=> loadPage(S.cur-1);
$("#pgNext").onclick = ()=> loadPage(S.cur+1);
$("#pgAdd").onclick = newPage;
$("#pgCopy").onclick = copyPage;

/* ================= 渲染 ================= */
function fitScale(){
  const pad = 68;
  const cw = stageEl.clientWidth - pad, ch = stageEl.clientHeight - pad;
  const s = Math.min(cw / S.page.w, ch / S.page.h);
  S.scale = Math.max(0.15, Math.min(s, 1.6));
  wrapEl.style.width = (S.page.w * S.scale) + "px";
  wrapEl.style.height = (S.page.h * S.scale) + "px";
  pageEl.style.transform = `scale(${S.scale})`;
  pageEl.style.width = S.page.w + "px";
  pageEl.style.height = S.page.h + "px";
}
function toPage(e){
  const r = pageEl.getBoundingClientRect();
  return {x:(e.clientX - r.left)/S.scale, y:(e.clientY - r.top)/S.scale};
}

function render(){
  pageEl.style.setProperty("--ink", "#14161a");
  pageEl.style.setProperty("--paper", S.page.bg);
  pageEl.style.setProperty("--line", S.page.line + "px");
  pageEl.style.background = S.page.bg;
  fitScale();
  pageEl.innerHTML = "";

  S.panels.forEach((p,i)=> pageEl.appendChild(buildPanel(p,i)));
  S.bubbles.forEach(b=> pageEl.appendChild(buildBubble(b)));
  renderSelPane();
  renderPrompts();
  autosave();
}

function buildPanel(p, idx){
  const el = document.createElement("div");
  el.className = "panel";
  if(S.sel && S.sel.type==="panel" && S.sel.id===p.id) el.classList.add("sel");
  el.style.left = p.x+"px"; el.style.top = p.y+"px";
  el.style.width = p.w+"px"; el.style.height = p.h+"px";
  el.dataset.id = p.id;

  if(p.img){
    const img = document.createElement("img");
    img.className = "pimg" + (p.gray ? " gray" : "");
    img.src = p.img;
    img.style.transform = `translate(${p.ox}px,${p.oy}px) scale(${p.zoom})`;
    el.appendChild(img);
  } else {
    const ph = document.createElement("div");
    ph.className = "ph ui-badge";
    ph.innerHTML = "双击选图<br><span style='font-size:10px;color:#a8adba'>或把图拖进来 / Ctrl+V</span>";
    el.appendChild(ph);
  }
  const badge = document.createElement("div");
  badge.className = "pbadge ui-badge";
  badge.textContent = "P" + (idx+1);
  el.appendChild(badge);

  if(S.sel && S.sel.type==="panel" && S.sel.id===p.id){
    const grip = document.createElement("div");
    grip.className = "grip";
    grip.style.left = "9px"; grip.style.top = "9px";
    el.appendChild(grip);
    bindPanelMove(grip, p, el);

    const hd = document.createElement("div");
    hd.className = "handle";
    hd.style.right = "-6px"; hd.style.bottom = "-6px";
    el.appendChild(hd);
    bindPanelResize(hd, p, el);
  }

  bindPanel(el, p);
  return el;
}
function bindPanel(el, p){
  el.addEventListener("pointerdown", e=>{
    if(el.dataset.dragged) return;
    select({type:"panel", id:p.id});
    if(!p.img) return;
    // 拖拽平移画面
    const sx = e.clientX, sy = e.clientY;
    const ox = p.ox, oy = p.oy;
    let moved = false;
    try{ el.setPointerCapture(e.pointerId) }catch(_e){};
    const mv = ev=>{
      const dx = (ev.clientX - sx)/S.scale, dy = (ev.clientY - sy)/S.scale;
      if(Math.abs(dx)>2 || Math.abs(dy)>2) moved = true;
      p.ox = ox + dx; p.oy = oy + dy;
      const im = el.querySelector(".pimg");
      if(im) im.style.transform = `translate(${p.ox}px,${p.oy}px) scale(${p.zoom})`;
    };
    const up = ()=>{
      el.removeEventListener("pointermove", mv);
      if(moved){ el.dataset.dragged = "1"; setTimeout(()=>delete el.dataset.dragged,0); }
      render();
    };
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", up, {once:true});
  });
  el.addEventListener("dblclick", e=>{
    e.stopPropagation();
    pickImage(p.id);
  });
  el.addEventListener("dragover", e=>{ e.preventDefault(); el.style.filter="brightness(1.06)"; });
  el.addEventListener("dragleave", ()=> el.style.filter="");
  el.addEventListener("drop", e=>{
    e.preventDefault(); el.style.filter="";
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f && f.type.startsWith("image/")) loadFileInto(p.id, f);
  });
  el.addEventListener("wheel", e=>{
    if(!p.img) return;
    e.preventDefault();
    p.zoom = Math.max(0.4, Math.min(4, p.zoom * (e.deltaY < 0 ? 1.08 : 0.925)));
    const im = el.querySelector(".pimg");
    if(im) im.style.transform = `translate(${p.ox}px,${p.oy}px) scale(${p.zoom})`;
    clearTimeout(el._wt);
    el._wt = setTimeout(render, 400);
  }, {passive:false});
}
function bindPanelMove(grip, p, el){
  grip.addEventListener("pointerdown", e=>{
    e.stopPropagation(); e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ox = p.x, oy = p.y;
    try{ grip.setPointerCapture(e.pointerId) }catch(_e){};
    const mv = ev=>{
      p.x = Math.max(0, Math.min(S.page.w - p.w, ox + (ev.clientX-sx)/S.scale));
      p.y = Math.max(0, Math.min(S.page.h - p.h, oy + (ev.clientY-sy)/S.scale));
      el.style.left = p.x+"px"; el.style.top = p.y+"px";
    };
    const up = ()=>{ grip.removeEventListener("pointermove", mv); render(); };
    grip.addEventListener("pointermove", mv);
    grip.addEventListener("pointerup", up, {once:true});
  });
}
function bindPanelResize(hd, p, el){
  hd.addEventListener("pointerdown", e=>{
    e.stopPropagation(); e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ow = p.w, oh = p.h;
    try{ hd.setPointerCapture(e.pointerId) }catch(_e){};
    const mv = ev=>{
      p.w = Math.max(80, ow + (ev.clientX-sx)/S.scale);
      p.h = Math.max(80, oh + (ev.clientY-sy)/S.scale);
      el.style.width = p.w+"px"; el.style.height = p.h+"px";
    };
    const up = ()=>{ hd.removeEventListener("pointermove", mv); render(); };
    hd.addEventListener("pointermove", mv);
    hd.addEventListener("pointerup", up, {once:true});
  });
}

/* ---------- 气泡 ---------- */
function tailSvg(b){
  const dir = b.tailDir || "down", pos = (b.tailPos==null? 50 : b.tailPos);
  let style = "";
  if(dir==="down") style = `left:calc(${pos}% - 23px);bottom:-22px;`;
  if(dir==="up")   style = `left:calc(${pos}% - 23px);top:-22px;transform:rotate(180deg);`;
  if(dir==="left") style = `top:calc(${pos}% - 13px);left:-40px;transform:rotate(90deg);`;
  if(dir==="right")style = `top:calc(${pos}% - 13px);right:-40px;transform:rotate(-90deg);`;
  return `<svg class="tail" style="${style}" viewBox="0 0 46 26"><path d="M3,3 L43,3 L20,24"/></svg>`;
}
function buildBubble(b){
  const el = document.createElement("div");
  el.className = "bubble " + ({speech:"sp", shout:"sh", thought:"th", box:"bx", sfx:"sf"}[b.type] || "sp");
  if(S.sel && S.sel.type==="bubble" && S.sel.id===b.id) el.classList.add("sel");
  el.style.left = b.x+"px"; el.style.top = b.y+"px";
  el.style.width = b.w+"px";
  el.dataset.id = b.id;

  const t = document.createElement("div");
  t.className = "txt";
  t.textContent = b.text || "";
  t.style.fontSize = (b.fs || 21)+"px";
  t.style.textAlign = b.align || (b.type==="box" ? "left" : "center");
  if(b.vertical) t.style.writingMode = "vertical-rl";
  if(b.type==="box") t.style.fontSize = (b.fs||19)+"px";
  el.appendChild(t);

  if(b.type==="speech"){
    el.insertAdjacentHTML("beforeend", tailSvg(b));
  }

  if(S.sel && S.sel.type==="bubble" && S.sel.id===b.id){
    const hd = document.createElement("div");
    hd.className = "handle";
    hd.style.right = "-6px"; hd.style.top = "50%";
    hd.style.cursor = "ew-resize";
    el.appendChild(hd);
    bindBubbleWidth(hd, b, el);
  }

  bindBubble(el, b, t);
  return el;
}
function bindBubble(el, b, t){
  el.addEventListener("pointerdown", e=>{
    if(t.getAttribute("contenteditable") === "true") return;
    e.stopPropagation();
    select({type:"bubble", id:b.id});
    const sx = e.clientX, sy = e.clientY, ox = b.x, oy = b.y;
    let moved = false;
    try{ el.setPointerCapture(e.pointerId) }catch(_e){};
    const mv = ev=>{
      const dx = (ev.clientX-sx)/S.scale, dy = (ev.clientY-sy)/S.scale;
      if(Math.abs(dx)>2||Math.abs(dy)>2) moved = true;
      b.x = ox + dx; b.y = oy + dy;
      el.style.left = b.x+"px"; el.style.top = b.y+"px";
    };
    const up = ()=>{
      el.removeEventListener("pointermove", mv);
      if(moved) render(); else renderSelPane();
    };
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", up, {once:true});
  });
  el.addEventListener("dblclick", e=>{
    e.stopPropagation();
    t.setAttribute("contenteditable","true");
    t.focus();
    document.execCommand && document.execCommand("selectAll", false, null);
    t.addEventListener("input", ()=>{ b.text = t.innerText; }, {once:false});
    t.addEventListener("blur", ()=>{
      t.removeAttribute("contenteditable");
      b.text = t.innerText;
      render();
    }, {once:true});
  });
}
function bindBubbleWidth(hd, b, el){
  hd.addEventListener("pointerdown", e=>{
    e.stopPropagation(); e.preventDefault();
    const sx = e.clientX, ow = b.w;
    try{ hd.setPointerCapture(e.pointerId) }catch(_e){};
    const mv = ev=>{
      b.w = Math.max(90, ow + (ev.clientX-sx)/S.scale);
      el.style.width = b.w+"px";
    };
    const up = ()=>{ hd.removeEventListener("pointermove", mv); render(); };
    hd.addEventListener("pointermove", mv);
    hd.addEventListener("pointerup", up, {once:true});
  });
}

function bubbleById(id){ return S.bubbles.find(b=>b.id===id); }

function reTail(svg, b){
  const html = tailSvg(b);
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  const neu = tmp.firstElementChild;
  svg.setAttribute("style", neu.getAttribute("style"));
}
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ================= 图片 ================= */
let pendingPanel = null;
function pickImage(panelId){
  pendingPanel = panelId;
  const inp = $("#file");
  inp.value = "";
  inp.click();
}
$("#file").onchange = e=>{
  const f = e.target.files[0];
  if(f) loadFileInto(pendingPanel, f);
};
function loadFileInto(panelId, file){
  const p = panelById(panelId); if(!p) return;
  const r = new FileReader();
  r.onload = () => {
    p.img = r.result; p.ox = 0; p.oy = 0; p.zoom = 1; p.gray = p.gray || false;
    S.sel = {type:"panel", id:p.id};
    render();
    toast("已放入 P" + (S.panels.indexOf(p)+1));
  };
  r.readAsDataURL(file);
}
document.addEventListener("paste", e=>{
  const items = (e.clipboardData || {}).items || [];
  for(const it of items){
    if(it.type.indexOf("image") === 0){
      const f = it.getAsFile();
      let target = S.sel && S.sel.type==="panel" ? S.sel.id : null;
      if(!target){
        const p = S.panels.find(p=>!p.img);
        target = p ? p.id : (S.panels[0] && S.panels[0].id);
      }
      if(target){ loadFileInto(target, f); e.preventDefault(); }
      break;
    }
  }
});

/* ================= 增删 ================= */
function addBubble(type){
  const host = (S.sel && S.sel.type==="panel") ? panelById(S.sel.id) : S.panels[0];
  let x = 60, y = 60, w = 300;
  if(host){
    w = Math.min(330, Math.round(host.w*0.62));
    x = host.x + Math.round(host.w*0.1);
    y = host.y + Math.round(host.h*0.12);
  }
  const b = {
    id:uid(), type, text:{
      speech:"“……”,说点什么。",
      shout:"等一下！",

      box:"三天前的夜里。",
      sfx:"哗啦——"
    }[type],
    x, y, w,
    fs: type==="sfx" ? 46 : (type==="box"?19:21),
    align: type==="box" ? "left" : "center",
    tailDir:"down", tailPos:50, panelId: host ? host.id : null,
    vertical:false
  };
  S.bubbles.push(b);
  S.sel = {type:"bubble", id:b.id};

function addPanel(){
  const a = area();
  const p = {id:uid(), x:a.x, y:Math.round(a.y + a.h*0.62), w:a.w, h:Math.round(a.h*0.34), img:null, ox:0, oy:0, zoom:1, gray:false};
  S.panels.push(p);
  S.sel = {type:"panel", id:p.id};

}

/* ================= 提示词 ================= */
function renderPrompts(){
  $("#charDef").value = S.char;
  $("#styleDef").value = S.style;
  const list = $("#promptList");
  list.innerHTML = S.panels.map((p,i)=>{
    const d = S.promptByPanel[p.id] || {shot:"中景", desc:"", mood:"", light:"黄昏，侧逆光"};
    return `<div class="pitem" data-pid="${p.id}">
      <div class="h"><b>P${i+1}</b><span class="pill">${p.img? "已放图" : "待生成"}</span></div>
      <select data-k="shot">
        ${["远景","全景","中景","近景","特写","大特写"].map(s=>`<option ${d.shot===s?"selected":""}>${s}</option>`).join("")}
      </select>
      <textarea data-k="desc" rows="2" placeholder="这一格画什么（动作、道具、背景）">${escapeHtml(d.desc||"")}</textarea>
      <input data-k="mood" value="${escapeHtml(d.mood||"")}" placeholder="情绪 / 表情">
      <input data-k="light" value="${escapeHtml(d.light||"")}" placeholder="光线 / 氛围">
    </div>`;
  }).join("") || '<div class="empty">先在页面上分格。</div>';

  list.querySelectorAll(".pitem").forEach(item=>{
    const pid = item.dataset.pid;
    item.querySelectorAll("[data-k]").forEach(inp=>{
      inp.oninput = () => {
        const d = S.promptByPanel[pid] || {};
        d[inp.dataset.k] = inp.value;
        S.promptByPanel[pid] = d;
        buildOut();
      };
      inp.onchange = inp.oninput;
    });
  });
  buildOut();
}
function buildOut(){
  const lines = [];
  lines.push("【角色（固定）】" + S.char);
  lines.push("【画风】" + S.style);
  lines.push("");
  const withImg = [];
  S.panels.forEach((p,i)=>{
    const d = S.promptByPanel[p.id] || {};
    lines.push(`【P${i+1}】${d.shot || "中景"}`);
    if(d.desc) lines.push("  画面：" + d.desc);
    if(d.mood) lines.push("  情绪：" + d.mood);
    if(d.light) lines.push("  光线：" + d.light);
    lines.push("");
    if(!p.img) withImg.push("P"+(i+1));
  });
  if(withImg.length) lines.push("（待生成：" + withImg.join("、") + "）");
  $("#out").value = lines.join("\n");
}
$("#btnCopyAll").onclick = ()=> copy($("#out").value, "全部提示词已复制");
$("#btnCopyP1").onclick = ()=>{
  const p = S.panels[0]; if(!p) return toast("还没分格");
  const d = S.promptByPanel[p.id] || {};
  const t = [`【角色（固定）】${S.char}`, `【画风】${S.style}`, `【P1】${d.shot||"中景"}`, d.desc?`  画面：${d.desc}`:"", d.mood?`  情绪：${d.mood}`:"", d.light?`  光线：${d.light}`:""].filter(Boolean).join("\n");
  copy(t, "第一格提示词已复制");
};
function copy(text, msg){
  const done = ()=> toast(msg);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  ta.remove();
}

function setTab(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  $("#pane-page").style.display = t==="page"?"block":"none";
  $("#pane-sel").style.display  = t==="sel"?"block":"none";
  $("#pane-prompt").style.display = t==="prompt"?"block":"none";
}

pageEl.addEventListener("pointerdown", e=>{
  if(e.target === pageEl){ S.sel = null; render(); }
});

document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select") || e.target.isContentEditable) return;
  if((e.key === "Backspace" || e.key === "Delete") && S.sel){
    const el = pageEl.querySelector(`[data-id="${S.sel.id}"]`);
    if(el && el.getAttribute("contenteditable")==="true") return;
    delSel(); e.preventDefault();
  }
  if(e.key === "Escape"){ S.sel = null; render(); }
});
function delSel(){
  if(S.sel.type === "bubble"){ S.bubbles = S.bubbles.filter(b=>b.id!==S.sel.id); }
  if(S.sel.type === "panel") { const p = panelById(S.sel.id); if(p && p.img){p.img=null;p.ox=0;p.oy=0;p.zoom=1;} }
  S.sel = null; render();
}

/* ================= 导出：Canvas 手绘（不用 foreignObject，避免画布污染） ================= */
const FONT_STACK = '"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif';
const STAR_PTS = [[50,0],[58,12],[72,4],[74,18],[88,12],[86,26],[100,26],[92,38],[100,50],[86,56],
  [94,70],[78,68],[80,84],[66,78],[62,94],[50,84],[42,98],[36,82],[22,90],[24,72],[8,78],
  [14,62],[0,56],[10,46],[0,34],[14,30],[8,16],[24,20],[22,6],[36,14],[42,0]];

function wrapLines(ctx, text, maxW){
  const out = [];
  String(text || "").split("\n").forEach(para=>{
    let line = "";
    for(const ch of para){
      const t = line + ch;
      if(ctx.measureText(t).width > maxW && line){ out.push(line); line = ch; }
      else line = t;
    }
    out.push(line);
  });
  return out;
}
function roundRectPath(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function bubbleLayout(ctx, b){
  const fs = b.fs || 21;
  const isBox = b.type === "box", isSfx = b.type === "sfx", isSh = b.type === "shout";
  const padX = isBox ? 16 : (isSh ? 28 : 20);
  const padY = isBox ? 12 : (isSh ? 26 : 15);
  const innerW = Math.max(20, b.w - padX*2);
  ctx.font = `500 ${fs}px ${FONT_STACK}`;
  const lines = wrapLines(ctx, b.text || "", innerW);
  const lh = fs * 1.5;
  const h = isSfx ? fs*1.45 : padY*2 + lines.length*lh;
  return {fs, padX, padY, innerW, lines, lh, h, isBox};
}
function drawLines(ctx, m, x, y, w, b, color){
  ctx.fillStyle = color;
  ctx.textBaseline = "top";
  const align = b.align || (b.isBox ? "left" : "center");
  m.lines.forEach((ln, i)=>{
    if(b.vertical){
      let col = 0;
      for(const ch of ln.split("")){
        const cx = x + w - m.padX - 10 - col * (m.fs*1.12);
        ctx.fillText(ch, cx - ctx.measureText(ch).width/2, y + m.padY + i*(m.h - m.padY*2));
        // 竖排：一行文字占一列，字符自上而下
      }
      return;
    }
    const tw = ctx.measureText(ln).width;
    let tx = x + m.padX;
    if(align === "center") tx = x + (w - tw)/2;
    if(align === "right")  tx = x + w - m.padX - tw;
    ctx.fillText(ln, tx, y + m.padY + i*m.lh);
  });
}
function drawBubble(ctx, b){
  const m = bubbleLayout(ctx, b);
  const x = b.x, y = b.y, w = b.w, h = m.h;
  const ink = "#14161a", paper = S.page.bg;

  if(b.type === "speech"){
    ctx.lineWidth = 2.2; ctx.strokeStyle = ink; ctx.fillStyle = paper;
    roundRectPath(ctx, x, y, w, h, Math.min(h*0.4, 34));
    ctx.fill(); ctx.stroke();

    const pos = (b.tailPos == null ? 50 : b.tailPos) / 100;
    ctx.save();
    if(b.tailDir === "up")            ctx.translate(x + w*pos, y);
    else if(b.tailDir === "left")   { ctx.translate(x, y + h*((b.tailPos==null?50:b.tailPos)/100)); ctx.rotate(Math.PI/2); }
    else if(b.tailDir === "right")  { ctx.translate(x + w, y + h*((b.tailPos==null?50:b.tailPos)/100)); ctx.rotate(-Math.PI/2); }
    else                            ctx.translate(x + w*pos, y + h);
    if(b.tailDir === "up") ctx.rotate(Math.PI);

    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(0, 24); ctx.lineTo(15, 0); ctx.closePath();
    ctx.fillStyle = paper; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(0, 24); ctx.lineTo(15, 0);
    ctx.strokeStyle = ink; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.stroke();
    ctx.restore();

    ctx.font = `500 ${m.fs}px ${FONT_STACK}`;
    drawLines(ctx, m, x, y, w, b, ink);
    return;
  }

  if(b.type === "shout"){
    ctx.save();
    ctx.beginPath();
    STAR_PTS.forEach((pt, i)=>{
      const px = x + pt[0]/100*w, py = y + pt[1]/100*h;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    });
    ctx.closePath();
    ctx.fillStyle = paper; ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.restore();
    ctx.font = `500 ${m.fs}px ${FONT_STACK}`;
    drawLines(ctx, m, x, y, w, b, ink);
    return;
  }

  if(b.type === "thought"){
    ctx.fillStyle = paper; ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h/2, w/2 - 1, h/2 - 1, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x + 30, y + h + 10, 8, 8, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x + 14, y + h + 24, 5, 5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.font = `500 ${m.fs}px ${FONT_STACK}`;
    drawLines(ctx, m, x, y, w, b, ink);
    return;
  }

  if(b.type === "box"){
    ctx.fillStyle = paper; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = ink; ctx.lineWidth = 2.2; ctx.strokeRect(x, y, w, h);
    ctx.font = `500 ${m.fs}px ${FONT_STACK}`;
    drawLines(ctx, m, x, y, w, b, ink);
    return;
  }

  // sfx 拟声
  ctx.font = `800 ${m.fs}px ${FONT_STACK}`;
  ctx.textBaseline = "top";
  const tw = ctx.measureText(b.text || "").width;
  const tx = x + (w - tw)/2, ty = y + 4;
  ctx.lineJoin = "round";
  ctx.strokeStyle = paper; ctx.lineWidth = Math.max(6, m.fs*0.14);
  ctx.strokeText(b.text || "", tx, ty);
  ctx.fillStyle = ink;
  ctx.fillText(b.text || "", tx, ty);
}

function drawPanel(ctx, p){
  const host = pageEl.querySelector(`[data-id="${p.id}"]`);
  const im = host ? host.querySelector(".pimg") : null;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  if(im && im.naturalWidth){
    const iw = im.naturalWidth, ih = im.naturalHeight;
    const k = Math.max(p.w/iw, p.h/ih) * (p.zoom || 1);
    const dw = iw*k, dh = ih*k;
    const dx = p.x + p.w/2 - dw/2 + (p.ox||0);
    const dy = p.y + p.h/2 - dh/2 + (p.oy||0);
    try{ ctx.filter = p.gray ? "grayscale(1) contrast(1.08)" : "none"; }catch(e){}
    ctx.drawImage(im, dx, dy, dw, dh);
    try{ ctx.filter = "none"; }catch(e){}
  } else {
    ctx.fillStyle = "#f1eee6"; ctx.fillRect(p.x, p.y, p.w, p.h);
  }
  ctx.restore();
  ctx.strokeStyle = "#14161a";
  ctx.lineWidth = S.page.line;
  ctx.strokeRect(p.x, p.y, p.w, p.h);
}

async function exportPNG(scale){
  scale = scale || 2;
  const W = S.page.w, H = S.page.h;
  // 确保图片已解码
  const imgs = [...pageEl.querySelectorAll(".pimg")];
  await Promise.all(imgs.map(im=> im.decode ? im.decode().catch(()=>{}) : null));

  const cv = document.createElement("canvas");
  cv.width = Math.round(W*scale); cv.height = Math.round(H*scale);
  const ctx = cv.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = S.page.bg;
  ctx.fillRect(0, 0, W, H);
  S.panels.forEach(p => drawPanel(ctx, p));
  S.bubbles.forEach(b => drawBubble(ctx, b));
  return cv;
}
$("#btnExport").onclick = async ()=>{
  try{
    toast("正在合成 2x 大图…");
    const cv = await exportPNG(2);
    cv.toBlob(b=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = "page-" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"") + ".png";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
      toast("PNG 已保存");
    }, "image/png");
  }catch(err){
    console.error(err);
    toast("导出失败：" + err.message);
  }
};

$("#btnSave").onclick = ()=>{
  commitPage();
  const data = JSON.stringify({ver:2, page:S.page, cur:S.cur, pages:S.pages, char:S.char, style:S.style, prompt:S.promptByPanel}, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  a.download = "comic-project-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
};
$("#btnOpen").onclick = ()=>{
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(d.pages && d.pages.length){
          S.pages = d.pages;
          S.cur = Math.min(d.cur||0, d.pages.length-1);
          S.panels = S.pages[S.cur].panels || [];
          S.bubbles = S.pages[S.cur].bubbles || [];
          S.layout = S.pages[S.cur].layout || "2x2";
        } else {
          S.panels = d.panels || []; S.bubbles = d.bubbles || [];
          S.layout = d.layout || "2x2";
          S.pages = [{panels:S.panels, bubbles:S.bubbles, layout:S.layout}];
          S.cur = 0;
        }
        S.page = d.page;
        S.char = d.char || DEF_CHAR; S.style = d.style || DEF_STYLE;
        S.promptByPanel = d.prompt || d.promptByPanel || {};
        S.sel = null;
        render(); updatePageBar();
        toast("工程已打开");
      }catch(err){ toast("文件读不懂：" + err.message); }
    };
    r.readAsText(f);
  };
  inp.click();
};

  page:{w:1080,h:1536, margin:36, gutter:14, line:2.4, bg:"#f6f4ef"},
  layout:"2x2",
  panels:[
    {img:DEMO_IMG.workshop, ox:0, oy:-10, zoom:1.06, gray:true},
    {img:DEMO_IMG.hand, ox:0, oy:0, zoom:1.12, gray:true},
    {img:DEMO_IMG.face, ox:0, oy:-30, zoom:1.08, gray:true},
    {img:DEMO_IMG.full, ox:0, oy:14, zoom:0.96, gray:true}
  ],
  bubbles:[
    {panelId:0, type:"box", text:"凌晨两点，工位只剩一盏灯。", x:46, y:36, w:330, fs:19, align:"left"},
    {panelId:1, type:"sfx", text:"咔", x:250, y:50, w:150, fs:54},
    {panelId:2, type:"speech", text:"谁动过我的密钥？", x:96, y:470, w:300, fs:23, tailDir:"up", tailPos:62},

  ],
  char: DEF_CHAR,
  style: DEF_STYLE,
  prompt:{
    0:"工位里，她坐在操作台前，手里拿着一块拆开的面板，回头看镜头，带一点笑意",
    1:"一手拿镊子从电路板上夹起一颗芯片，背景有焊台与白烟",
    2:"微微仰头，瞳孔收缩，被屏幕冷光从下方照亮，怔住",
    3:"站在锈色工业平台的黄昏逆光里，手拎工具钳"
  }
};
$("#btnDemo").onclick = ()=>{
  const p = DEMO.page, rects = rectsForLayout("2x2");
  S.page = JSON.parse(JSON.stringify(p));
  S.layout = "2x2";
  S.panels = rects.map((r,i)=>{
    const d = DEMO.panels[i] || {};
    return {id:uid(), x:r.x, y:r.y, w:r.w, h:r.h, img:d.img||null, ox:d.ox||0, oy:d.oy||0, zoom:d.zoom||1, gray:d.gray||false};
  });
  S.bubbles = DEMO.bubbles.map(b=>{
    const r = S.panels[b.panelId] || S.panels[0];
    return Object.assign({}, b, {
      id:uid(),
      panelId: r.id,
      x: r.x + b.x, y: r.y + b.y,
      vertical:false
    });
  });
  S.char = DEMO.char; S.style = DEMO.style;
  S.promptByPanel = {};
  S.panels.forEach((pn,i)=>{ if(DEMO.prompt[i]) S.promptByPanel[pn.id] = {
    shot:["中景","近景","大特写","全景"][i] || "中景",
    desc:DEMO.prompt[i], mood:["疲惫、克制","专注","怔住","安静但坚定"][i]||"",
    light:"深夜屏幕冷光 + 一盏暖色台灯" };
  });
  S.sel = null;
  [...$("#layoutSeg").children].forEach(x=>x.classList.toggle("on", x.dataset.l==="2x2"));
  document.querySelectorAll("#sizeSeg button").forEach(x=>x.classList.toggle("on", x.dataset.s==="v"));
  $("#margin").value = S.page.margin; $("#vMargin").textContent = S.page.margin;
  $("#gutter").value = S.page.gutter; $("#vGutter").textContent = S.page.gutter;
  $("#linew").value = S.page.line; $("#vLine").textContent = S.page.line;
  $("#paperColor").value = S.page.bg;
  render();
  toast("示例页已载入");
};

/* ================= 小工具 ================= */
let tt = null;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("on"), 1900);
}
function autosave(){
  try{
    commitPage();
    const slim = {ver:2, page:S.page, cur:S.cur, char:S.char, style:S.style, promptByPanel:S.promptByPanel,
      pages:S.pages.map(pg=>({layout:pg.layout, bubbles:pg.bubbles,
        panels:(pg.panels||[]).map(p=>({...p, img:p.img && p.img.length > 2600000 ? null : p.img}))}))};
    localStorage.setItem("comicstudio.v1", JSON.stringify(slim));
  }catch(e){ /* 配额满就跳过 */ }
}
function restore(){
  try{
    const raw = localStorage.getItem("comicstudio.v1");
    if(!raw) return false;
    const d = JSON.parse(raw);
    S.page = d.page;
    S.char = d.char || DEF_CHAR; S.style = d.style || DEF_STYLE;
    S.promptByPanel = d.promptByPanel || {};
    if(d.pages && d.pages.length){
      S.pages = d.pages;
      S.cur = Math.min(d.cur||0, d.pages.length-1);
      S.panels = S.pages[S.cur].panels || [];
      S.bubbles = S.pages[S.cur].bubbles || [];
      S.layout = S.pages[S.cur].layout || "2x2";
    }
    return S.panels && S.panels.length;
  }catch(e){ return false; }
}

/* 窗口尺寸变化 */
let rz = null;
window.addEventListener("resize", ()=>{ clearTimeout(rz); rz = setTimeout(fitScale, 120); });

/* 启动 */
(function boot(){
  const ok = restore();
  if(!ok){
    applyLayout("2x2");
    S.pages = [{panels:S.panels, bubbles:S.bubbles, layout:S.layout}];
    S.cur = 0;
  }
  if(!S.pages.length) S.pages = [{panels:S.panels, bubbles:S.bubbles, layout:S.layout}];
  fitScale();
  render();
  updatePageBar();
  setTab("page");
})();

window.__test = { exportPNG, getState: ()=>S };
